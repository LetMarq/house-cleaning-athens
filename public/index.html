    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Pixelify Sans", ui-monospace, monospace;
      font-size: 18px;
      line-height: 1.4;
      overflow-x: hidden;
      /* little checkerboard, like an old game background */
      background-color: var(--bg);
      background-image:
        linear-gradient(45deg, var(--bg-check) 25%, transparent 25%, transparent 75%, var(--bg-check) 75%),
        linear-gradient(45deg, var(--bg-check) 25%, transparent 25%, transparent 75%, var(--bg-check) 75%);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
    }
    img, .sprite { image-rendering: pixelated; }

    /* Pixel box: square outline with "notched" corners + chunky drop shadow */
    .pixel {
      background: var(--card);
      box-shadow:
        0 calc(var(--px) * -1) 0 0 var(--edge),
        0 var(--px) 0 0 var(--edge),
        calc(var(--px) * -1) 0 0 0 var(--edge),
        var(--px) 0 0 0 var(--edge),
        0 calc(var(--px) * 2) 0 0 var(--drop);
    }

    /* floating pixel bubbles */
    .bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .bubbles span {
      position: absolute;
      bottom: -80px;
      background: var(--spr-bubble) center / contain no-repeat;
      image-rendering: pixelated;
      animation: rise steps(48) infinite;
    }
    @keyframes rise {
      from { transform: translate(0, 0); opacity: 0; }
      8%   { opacity: 1; }
      50%  { transform: translate(12px, -55vh); }
      to   { transform: translate(-8px, -115vh); opacity: 0; }
    }

    main { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding: 32px 18px 64px; }

    header { text-align: center; margin-bottom: 30px; }
    .logo {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 10px 16px;
      font-family: "Press Start 2P", monospace; font-size: 12px; letter-spacing: .02em;
      color: var(--edge);
    }
    .logo i { width: 24px; height: 24px; background: var(--spr-bubble) center / contain no-repeat; image-rendering: pixelated; }

    .hero { padding: 26px 20px 22px; text-align: center; }
    .label { font-family: "Press Start 2P", monospace; font-size: 11px; color: var(--muted); line-height: 1.8; }

    .who {
      display: inline-block;
      margin: 18px 0 16px;
      padding: 16px 22px 14px;
      font-family: "Press Start 2P", monospace;
      font-size: clamp(22px, 7.5vw, 34px);
      line-height: 1.2;
      color: #fff;
      background: var(--accent);
      text-shadow: 3px 3px 0 color-mix(in srgb, var(--accent) 60%, black);
      box-shadow:
        0 calc(var(--px) * -1) 0 0 color-mix(in srgb, var(--accent) 65%, black),
        0 var(--px) 0 0 color-mix(in srgb, var(--accent) 65%, black),
        calc(var(--px) * -1) 0 0 0 color-mix(in srgb, var(--accent) 65%, black),
        var(--px) 0 0 0 color-mix(in srgb, var(--accent) 65%, black),
        0 calc(var(--px) * 2) 0 0 color-mix(in srgb, var(--accent) 40%, black),
        inset 4px 4px 0 0 color-mix(in srgb, var(--accent) 60%, white);
      position: relative;
      animation: bob 1.2s steps(2) infinite;
    }
    .who::before, .who::after { /* sparkles around the name */
      content: ""; position: absolute; width: 21px; height: 21px;
      background: var(--spr-sparkle) center / contain no-repeat; image-rendering: pixelated;
      animation: twinkle 1.6s steps(2) infinite;
    }
    .who::before { top: -18px; left: -16px; }
    .who::after  { bottom: -14px; right: -18px; animation-delay: .8s; }
    @keyframes bob { 50% { transform: translateY(-4px); } }
    @keyframes twinkle { 50% { opacity: 0; } }

    .period {
      display: inline-block; margin: 0 0 22px; padding: 4px 12px;
      background: var(--soft); color: var(--ink); font-size: 17px; font-weight: 600;
    }

    .tasks { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; text-align: left; }
    .tasks label {
      display: flex; gap: 14px; align-items: center;
      padding: 10px 14px; cursor: pointer;
      background: var(--soft);
      box-shadow:
        0 calc(var(--px) * -1) 0 0 color-mix(in srgb, var(--edge) 35%, transparent),
        0 var(--px) 0 0 color-mix(in srgb, var(--edge) 35%, transparent),
        calc(var(--px) * -1) 0 0 0 color-mix(in srgb, var(--edge) 35%, transparent),
        var(--px) 0 0 0 color-mix(in srgb, var(--edge) 35%, transparent);
    }
    .tasks label:hover { background: color-mix(in srgb, var(--accent) 14%, var(--soft)); }
    .tasks input { position: absolute; opacity: 0; pointer-events: none; }
    .check {
      flex: none; width: 24px; height: 24px; margin: 4px;
      background: var(--card);
      box-shadow:
        0 -3px 0 0 var(--accent), 0 3px 0 0 var(--accent),
        -3px 0 0 0 var(--accent), 3px 0 0 0 var(--accent);
    }
    .tasks input:checked ~ .check {
      background: var(--accent) var(--spr-heart) center / 16px 16px no-repeat;
      image-rendering: pixelated;
      animation: pop .3s steps(3);
    }
    @keyframes pop { 50% { transform: scale(1.3); } }
    .tasks input:focus-visible ~ .check { outline: 3px dashed var(--edge); outline-offset: 5px; }
    .tasks input:checked ~ .text { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 2px; }

    /* segmented progress bar */
    .bar { margin: 24px 4px 8px; height: 20px; background: var(--soft); padding: 4px;
      box-shadow:
        0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge); }
    .bar div {
      height: 100%; width: 0;
      background: repeating-linear-gradient(90deg, var(--accent) 0 12px, transparent 12px 16px);
      transition: width .5s steps(6);
    }
    .progress { font-size: 16px; color: var(--muted); font-weight: 600; margin-top: 10px; }

    h2 {
      font-family: "Press Start 2P", monospace; font-weight: 400; font-size: 14px;
      margin: 44px 0 20px; text-align: center; color: var(--edge);
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    h2 i { width: 21px; height: 18px; background: var(--spr-heart-pink) center / contain no-repeat; image-rendering: pixelated; }

    .weeks { list-style: none; padding: 0; margin: 0; display: grid; gap: 18px; }
    .weeks li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 14px 8px 8px; }
    .name { display: flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 600; }
    .avatar {
      flex: none; width: 36px; height: 36px; display: grid; place-items: center;
      font-family: "Press Start 2P", monospace; font-size: 14px; color: #fff;
      text-shadow: 2px 2px 0 rgba(0,0,0,.25);
    }
    .when { color: var(--muted); font-size: 16px; font-weight: 500; text-align: right; }
    .when small { display: block; font-family: "Press Start 2P", monospace; font-size: 8px; margin-bottom: 4px; color: var(--edge); }
    .past { opacity: .55; }

    footer { margin-top: 44px; font-size: 16px; color: var(--muted); text-align: center; }

    @media (prefers-reduced-motion: reduce) {
      .bubbles span { display: none; }
      .who, .who::before, .who::after, .tasks input:checked ~ .check { animation: none; }
    }
  </style>
</head>
<body>
  <div class="bubbles" id="bubbles" aria-hidden="true"></div>

  <main>
    <header><span class="logo pixel"><i aria-hidden="true"></i>HOUSE CLEANING</span></header>

    <section class="hero pixel">
      <div class="label">THIS WEEK IT'S</div>
      <div class="who" id="who">...</div>
      <div><span class="period" id="period"></span></div>
      <ul class="tasks" id="tasks"></ul>
      <div class="bar"><div id="bar"></div></div>
      <div class="progress" id="progress"></div>
    </section>

    <h2><i aria-hidden="true"></i>UPCOMING<i aria-hidden="true"></i></h2>
    <ul class="weeks" id="weeks"></ul>

    <footer>Every Monday morning an email goes out with whose turn it&nbsp;is&nbsp;♥</footer>
  </main>

  <script type="module">
    import { CONFIG, getWeek, formatRange } from "./schedule.js";

    // Background bubbles: sizes are multiples of the 12px sprite so the pixels stay crisp
    const bubbles = document.getElementById("bubbles");
    const COUNT = 12;
    for (let i = 0; i < COUNT; i++) {
      const b = document.createElement("span");
      const size = 12 * (2 + Math.floor(Math.random() * 4)); // 24, 36, 48 or 60px
      b.style.width = b.style.height = `${size}px`;
      // Split the screen into COUNT strips and put one bubble in each,
      // so they're always spread across the whole width
      const x = ((i + Math.random()) / COUNT) * 100;
      b.style.left = `calc(${x}% - ${size / 2}px)`;
      b.style.animationDuration = `${16 + Math.random() * 14}s`;
      b.style.animationDelay = `${-Math.random() * 25}s`;
      bubbles.appendChild(b);
    }

    // Names come from the server (.env), never from the code
    let names = [];
    try {
      const res = await fetch("/api/people");
      names = (await res.json()).names || [];
    } catch {}
    if (names.length === 0) {
      document.getElementById("who").textContent = "?";
      document.getElementById("period").textContent = "Couldn't load the rotation";
      throw new Error("No names loaded from /api/people");
    }

    const color = (i) => `var(--p${i % 3})`;
    const current = getWeek(names, 0);
    document.documentElement.style.setProperty("--accent", color(current.index));

    document.getElementById("who").textContent = current.person;
    document.getElementById("period").textContent = formatRange(current);

    // Checklist (saved only in this browser, resets every week)
    const key = `cleaning:${current.start.toISOString().slice(0, 10)}`;
    let done = [];
    try { done = JSON.parse(localStorage.getItem(key)) || []; } catch {}

    const list = document.getElementById("tasks");
    const progress = document.getElementById("progress");
    const bar = document.getElementById("bar");
    const updateProgress = () => {
      const n = done.length, t = CONFIG.tasks.length;
      bar.style.width = `${(n / t) * 100}%`;
      progress.textContent = n === t ? "★ All done! Sparkly clean ★" : `${n} of ${t} tasks done`;
    };

    CONFIG.tasks.forEach((task, i) => {
      const li = document.createElement("li");
      li.innerHTML = `<label><input type="checkbox"><span class="check"></span><span class="text"></span></label>`;
      li.querySelector(".text").textContent = task;
      const box = li.querySelector("input");
      box.checked = done.includes(i);
      box.addEventListener("change", () => {
        done = box.checked ? [...done, i] : done.filter((x) => x !== i);
        try { localStorage.setItem(key, JSON.stringify(done)); } catch {}
        updateProgress();
      });
      list.appendChild(li);
    });
    updateProgress();

    // Last week + next 6
    const weeks = document.getElementById("weeks");
    for (let o = -1; o <= 6; o++) {
      if (o === 0) continue;
      const s = getWeek(names, o);
      const li = document.createElement("li");
      li.className = o < 0 ? "pixel past" : "pixel";
      li.innerHTML = `<span class="name"><span class="avatar"></span><span class="who-name"></span></span><span class="when"></span>`;
      const avatar = li.querySelector(".avatar");
      avatar.style.background = color(s.index);
      avatar.textContent = s.person.charAt(0);
      li.querySelector(".who-name").textContent = s.person;
      const tag = o === -1 ? "LAST WEEK" : o === 1 ? "NEXT" : "";
      li.querySelector(".when").innerHTML = (tag ? `<small>${tag}</small>` : "") + formatRange(s);
      weeks.appendChild(li);
    }
  </script>
</body>
</html>
